name: rn-native
# Real native build of @lucida-analytics/react-native inside a fresh Expo SDK 52 app (autolinking + config plugin),
# then the Release app is RUN on an Android emulator and an iOS simulator. With the optional secrets below it also records
# a replay session against capture.lucidace.com and checks the API stored a chunk.
# Secrets (all optional, the run steps skip with a notice when absent): LUCIDA_CI_KEY (project public key lc_pk_...),
# LUCIDA_CI_API_KEY (personal API key, replay:read scope), LUCIDA_CI_PROJECT (project uuid).
on:
  push:
    branches: [main]
    paths: ["packages/react-native/**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  # On the public repo's main branch and release tags a missing CI secret fails the run instead of skipping the replay check.
  LUCIDA_CI_REQUIRED: ${{ github.repository == 'lucidaanalytics/lucida-js' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
  CREATE_EXPO_APP: create-expo-app@3.5.3
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Pack the package (build + vendor prepack)
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @lucida-analytics/react-native build
          pnpm --filter @lucida-analytics/react-native pack --pack-destination "$RUNNER_TEMP"
      - name: Fresh Expo app with the package and plugin
        env:
          LUCIDA_CI_KEY: ${{ secrets.LUCIDA_CI_KEY }}
        run: |
          # Resolve only versions at least a day old: a fresh publish can 404 on npm's CDN for a while.
          export npm_config_before="$(node -p 'new Date(Date.now() - 864e5).toISOString()')"
          npx --yes "$CREATE_EXPO_APP" example --template blank-typescript@sdk-52 --no-install
          cd example
          npm install --legacy-peer-deps "$RUNNER_TEMP"/lucida-analytics-react-native-*.tgz
          node -e 'const f="app.json",j=require("./"+f),id="com.lucida.cinative";j.expo.plugins=[...(j.expo.plugins||[]),"@lucida-analytics/react-native"];j.expo.android={...j.expo.android,package:id};j.expo.ios={...j.expo.ios,bundleIdentifier:id};require("fs").writeFileSync(f,JSON.stringify(j,null,2))'
          cp "$GITHUB_WORKSPACE/.github/rn-native/App.tsx" App.tsx
          # The public key is baked into the bundle (it is a public key); empty when the secret is absent.
          node -e 'require("fs").writeFileSync("lucida-ci.json",JSON.stringify({key:process.env.LUCIDA_CI_KEY||""}))'
          npx expo prebuild --no-install --platform android
      - name: Build release APK (JS bundled, debug keystore)
        run: cd example/android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Autolinking registered the package
        # PackageList.java is generated by the Gradle build (app/build/generated/autolinking), not by prebuild.
        run: grep -rl LucidaReactPackage example/android --include=PackageList.java | grep .
      - name: The class is in the APK
        run: unzip -p example/android/app/build/outputs/apk/release/app-release.apk 'classes*.dex' | grep -c 'com/lucida/reactnative/LucidaReactPackage' | grep -v '^0$'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          LUCIDA_CI_KEY: ${{ secrets.LUCIDA_CI_KEY }}
        with:
          api-level: 34
          arch: x86_64
          script: bash .github/rn-native/android-run.sh
      - name: Replay reached the Lucida API
        env:
          LUCIDA_CI_KEY: ${{ secrets.LUCIDA_CI_KEY }}
          LUCIDA_CI_API_KEY: ${{ secrets.LUCIDA_CI_API_KEY }}
          LUCIDA_CI_PROJECT: ${{ secrets.LUCIDA_CI_PROJECT }}
        run: |
          if [ -z "$LUCIDA_CI_KEY" ] || [ -z "$LUCIDA_CI_API_KEY" ] || [ -z "$LUCIDA_CI_PROJECT" ]; then
            if [ "$LUCIDA_CI_REQUIRED" = true ]; then echo "::error::LUCIDA_CI_KEY, LUCIDA_CI_API_KEY and LUCIDA_CI_PROJECT are required on main and release tags"; exit 1; fi
            echo "::notice::LUCIDA_CI_KEY, LUCIDA_CI_API_KEY and LUCIDA_CI_PROJECT not all set: API check skipped"; exit 0
          fi
          bash .github/rn-native/poll-replay.sh "$(cat session.txt)"
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Pack the package (build + vendor prepack)
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @lucida-analytics/react-native build
          pnpm --filter @lucida-analytics/react-native pack --pack-destination "$RUNNER_TEMP"
      - name: Fresh Expo app with the package and plugin
        env:
          LUCIDA_CI_KEY: ${{ secrets.LUCIDA_CI_KEY }}
        run: |
          # Resolve only versions at least a day old: a fresh publish can 404 on npm's CDN for a while.
          export npm_config_before="$(node -p 'new Date(Date.now() - 864e5).toISOString()')"
          npx --yes "$CREATE_EXPO_APP" example --template blank-typescript@sdk-52 --no-install
          cd example
          npm install --legacy-peer-deps "$RUNNER_TEMP"/lucida-analytics-react-native-*.tgz
          node -e 'const f="app.json",j=require("./"+f),id="com.lucida.cinative";j.expo.plugins=[...(j.expo.plugins||[]),"@lucida-analytics/react-native"];j.expo.android={...j.expo.android,package:id};j.expo.ios={...j.expo.ios,bundleIdentifier:id};require("fs").writeFileSync(f,JSON.stringify(j,null,2))'
          cp "$GITHUB_WORKSPACE/.github/rn-native/App.tsx" App.tsx
          # The public key is baked into the bundle (it is a public key); empty when the secret is absent.
          node -e 'require("fs").writeFileSync("lucida-ci.json",JSON.stringify({key:process.env.LUCIDA_CI_KEY||""}))'
          npx expo prebuild --no-install --platform ios
      - name: Pods and simulator build
        run: |
          cd example/ios
          pod install
          grep -q lucida-analytics-react-native Podfile.lock
          ws=$(ls -d *.xcworkspace | head -n1)
          xcodebuild -workspace "$ws" -scheme "${ws%.xcworkspace}" -sdk iphonesimulator -configuration Release -derivedDataPath build build CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log
      - name: The module object is compiled
        run: find example/ios/build -name 'LucidaReplay*.o' | grep .
      - name: Run the app on a simulator
        env:
          LUCIDA_CI_KEY: ${{ secrets.LUCIDA_CI_KEY }}
        run: bash .github/rn-native/ios-run.sh
      - name: Replay reached the Lucida API
        env:
          LUCIDA_CI_KEY: ${{ secrets.LUCIDA_CI_KEY }}
          LUCIDA_CI_API_KEY: ${{ secrets.LUCIDA_CI_API_KEY }}
          LUCIDA_CI_PROJECT: ${{ secrets.LUCIDA_CI_PROJECT }}
        run: |
          if [ -z "$LUCIDA_CI_KEY" ] || [ -z "$LUCIDA_CI_API_KEY" ] || [ -z "$LUCIDA_CI_PROJECT" ]; then
            if [ "$LUCIDA_CI_REQUIRED" = true ]; then echo "::error::LUCIDA_CI_KEY, LUCIDA_CI_API_KEY and LUCIDA_CI_PROJECT are required on main and release tags"; exit 1; fi
            echo "::notice::LUCIDA_CI_KEY, LUCIDA_CI_API_KEY and LUCIDA_CI_PROJECT not all set: API check skipped"; exit 0
          fi
          bash .github/rn-native/poll-replay.sh "$(cat session.txt)"
