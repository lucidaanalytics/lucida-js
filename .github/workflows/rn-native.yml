name: rn-native
# Real native build of @lucida-analytics/react-native inside a fresh Expo SDK 52 app (autolinking + config plugin).
on:
  push:
    branches: [main]
    paths: ["packages/react-native/**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  CREATE_EXPO_APP: create-expo-app@3.5.3
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Pack the package (build + vendor prepack)
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @lucida-analytics/react-native build
          pnpm --filter @lucida-analytics/react-native pack --pack-destination "$RUNNER_TEMP"
      - name: Fresh Expo app with the package and plugin
        run: |
          npx --yes "$CREATE_EXPO_APP" example --template blank-typescript@sdk-52 --no-install
          cd example
          npm install --legacy-peer-deps "$RUNNER_TEMP"/lucida-analytics-react-native-*.tgz
          node -e 'const f="app.json",j=require("./"+f);j.expo.plugins=[...(j.expo.plugins||[]),"@lucida-analytics/react-native"];require("fs").writeFileSync(f,JSON.stringify(j,null,2))'
          npx expo prebuild --no-install --platform android
      - name: Autolinking registered the package
        run: grep -rl LucidaReactPackage example/android --include=PackageList.java | grep .
      - name: Build debug APK
        run: cd example/android && ./gradlew assembleDebug --no-daemon
      - name: The class is in the APK
        run: unzip -p example/android/app/build/outputs/apk/debug/app-debug.apk 'classes*.dex' | grep -c 'com/lucida/reactnative/LucidaReactPackage' | grep -v '^0$'
  ios:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Pack the package (build + vendor prepack)
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @lucida-analytics/react-native build
          pnpm --filter @lucida-analytics/react-native pack --pack-destination "$RUNNER_TEMP"
      - name: Fresh Expo app with the package and plugin
        run: |
          npx --yes "$CREATE_EXPO_APP" example --template blank-typescript@sdk-52 --no-install
          cd example
          npm install --legacy-peer-deps "$RUNNER_TEMP"/lucida-analytics-react-native-*.tgz
          node -e 'const f="app.json",j=require("./"+f);j.expo.plugins=[...(j.expo.plugins||[]),"@lucida-analytics/react-native"];require("fs").writeFileSync(f,JSON.stringify(j,null,2))'
          npx expo prebuild --no-install --platform ios
      - name: Pods and simulator build
        run: |
          cd example/ios
          pod install
          grep -q lucida-analytics-react-native Podfile.lock
          ws=$(ls -d *.xcworkspace | head -n1)
          xcodebuild -workspace "$ws" -scheme "${ws%.xcworkspace}" -sdk iphonesimulator -configuration Debug -derivedDataPath build build CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log
      - name: The module object is compiled
        run: find example/ios/build -name 'LucidaReplay*.o' | grep .
