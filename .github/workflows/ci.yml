name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  LUCIDA_TESTDATA: ${{ github.workspace }}/testdata
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # version comes from package.json packageManager
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # no lockfile is mirrored; commit the pnpm-lock.yaml generated by the first run in this repo
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present build
  # Real-framework checks (G83): the wrappers are unit-tested against structural stand-ins in the monorepo, so this
  # job installs the actual framework packages and runs the `real/` suites, which also type-check against them.
  # The dependencies are added here only, so no framework ends up in a published package.json.
  frameworks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      # kit 3 moved its types (Handle); the wrapper is written against the 2.x line
      - run: pnpm --filter @lucida-analytics/svelte add -D @sveltejs/kit@2 svelte@5 vite@7
      - run: pnpm --filter @lucida-analytics/svelte exec tsgo --noEmit -p real/tsconfig.json
      - run: pnpm --filter @lucida-analytics/svelte exec vitest run -c real/vitest.config.ts
      - run: pnpm --filter @lucida-analytics/tanstack-start add -D @tanstack/react-router
      - run: pnpm --filter @lucida-analytics/tanstack-start exec tsgo --noEmit -p real/tsconfig.json
      - run: pnpm --filter @lucida-analytics/tanstack-start exec vitest run -c real/vitest.config.ts
